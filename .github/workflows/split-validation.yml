name: Split validation tests

on:
  pull_request:
    paths:
      - "src/config.py"
      - "src/split_dataset.py"
      - "tests/**"
      - ".github/workflows/split-validation.yml"
  push:
    branches: [main]
    paths:
      - "src/config.py"
      - "src/split_dataset.py"
      - "tests/**"
      - ".github/workflows/split-validation.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install "scikit-learn>=1.4,<2.0"
      - name: Run split validation tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
